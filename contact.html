<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us · PRAN — Carbon Market Infrastructure</title>
  <meta name="description" content="Talk to our team about project listing, enterprise credit procurement, or carbon intelligence integration.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-page { padding-top: 7rem; padding-bottom: 6rem; background-color: var(--pran-paper); }
    .contact-card {
      max-width: 36rem;
      margin: 2.5rem auto 0 auto;
      background-color: var(--pran-surface);
      border-radius: var(--radius-panel);
      padding: 2.5rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--pran-hairline);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header scrolled">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="brand-logo">
          <svg class="logo-emblem" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 2L4 8V24L16 30L28 24V8L16 2Z" fill="#12A33A"/>
            <path d="M16 6L8 10.5V21.5L16 26L24 21.5V10.5L16 6Z" fill="#0F3D2E"/>
          </svg>
          <span>PRAN</span>
        </a>

        <nav class="main-nav">
          <ul style="display: flex; gap: 0.25rem; align-items: center;">
            <li class="nav-item"><a href="marketplace.html" class="nav-link">Marketplace</a></li>
            <li class="nav-item"><a href="calculator.html" class="nav-link">Calculator</a></li>
            <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li class="nav-item"><a href="resources.html" class="nav-link">Resources</a></li>
            <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
          </ul>
        </nav>

        <div>
          <a href="marketplace.html" class="btn btn-primary btn-sm">Explore Marketplace</a>
        </div>
      </div>
    </div>
  </header>

  <main class="contact-page">
    <div class="container">
      <div style="text-align: center; max-width: 36rem; margin: 0 auto;">
        <p class="section-label">Contact Us</p>
        <h1 class="section-title">Talk to our team</h1>
        <p class="section-description">Whether you are looking to list a project, procure credits, or align with CCTS & ESG reporting, we're here to assist.</p>
      </div>

      <div class="contact-card">
        <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent. Our team will contact you within 24 hours.');">
          <div style="margin-bottom: 1.25rem;">
            <label style="font-size: 0.875rem; font-weight: 600; display: block; margin-bottom: 0.375rem;">Full Name</label>
            <input type="text" required class="calc-input" placeholder="e.g. Aditi Sharma">
          </div>

          <div style="margin-bottom: 1.25rem;">
            <label style="font-size: 0.875rem; font-weight: 600; display: block; margin-bottom: 0.375rem;">Work Email</label>
            <input type="email" required class="calc-input" placeholder="e.g. aditi@company.com">
          </div>

          <div style="margin-bottom: 1.25rem;">
            <label style="font-size: 0.875rem; font-weight: 600; display: block; margin-bottom: 0.375rem;">I am a...</label>
            <select class="calc-input" style="background-color: #ffffff;">
              <option>Corporate Credit Buyer</option>
              <option>Project Developer</option>
              <option>Trader / Financial Investor</option>
              <option>ESG / Compliance Advisor</option>
            </select>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label style="font-size: 0.875rem; font-weight: 600; display: block; margin-bottom: 0.375rem;">Message / Inquiry Details</label>
            <textarea required class="calc-input" rows="4" placeholder="Tell us about your credit sourcing or project listing requirements..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Inquiry</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p style="font-size: 0.75rem; color: rgba(255,255,255,0.5);">© 2026 PRAN Platform. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
